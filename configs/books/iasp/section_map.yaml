# Từ điển tên mục → loại mục của sách IASP (L13). Plan: docs/phases/P2R/I4_plan.md mục 3.
#
# Định dạng như sách mẫu: `khóa: loại  # ghi chú`; khóa = tên mục chữ thường, gộp khoảng trắng.
# Đủ 110 tên mục của Part II (đếm 2026-10-23) → không cần hỏi AI. Mục "Code X32.X3a" (mã dính
# sau tên) tra như "code" (luật riêng `section_key` của IASP). Mục con "1. History of …" kế thừa
# loại của mục cha.
# Tên ghép 2 ý chỉ nhận 1 loại → chọn ý CHÍNH (ghi chú ở cuối dòng).
# Quyết định của người duyệt (2026-10-23): Aggravating/Precipitating → symptom; Remarks → other;
# Schedule of … → cause.

# ---------------------------------------------------------------- definition
definition: definition

# ---------------------------------------------------------------- site, body_system (loại mới)
site: site
system: body_system
