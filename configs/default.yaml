# Cấu hình mặc định của Data-miner. Xem docs/phases/P0/P0.2_plan.md.
# Tùy chỉnh trên máy cá nhân: tạo configs/local.yaml (xem local.example.yaml).
# Ghi đè nhanh qua biến môi trường: DM__<NHÓM>__<KHÓA>, vd. DM__LLM__MODE=replay

project:
  book_id: book01            # chữ thường, số, '_' hoặc '-'; dùng trong ID và tên artifact
  book_file: book01.pdf      # file nằm trong paths.raw_dir

paths:                       # tương đối với gốc repo
  raw_dir: data/raw
  data_dir: data
  cache_dir: data/cache
  samples_dir: samples
  prompts_dir: prompts
  eval_dir: eval

llm:
  base_url: https://openrouter.ai/api/v1
  mode: live                 # live | replay (chỉ đọc cache) | refresh (bỏ qua cache)
  concurrency: 4             # số request đồng thời (1..64)
  max_retries: 4             # số lần thử lại khi lỗi 429/5xx/timeout (0..10)
  timeout_s: 120
  backoff_base_s: 1.0        # chờ giữa các lần retry: base * 2^n (+ jitter), tối đa backoff_max_s
  backoff_max_s: 30.0
  json_retries: 2            # chat_json: số lượt yêu cầu model sửa JSON sai schema

budget:                      # USD - vượt thì dừng (thực thi ở P0.3)
  total_usd: 20.0
  per_task_usd:
    ping: 1.0                # P0 chỉ dùng ping → P0 tối đa $1
    fix_ocr: 2.0             # P1.4 sửa lỗi OCR (dự kiến pilot < $0.01)
    classify: 0.5            # P2 phân loại tiêu đề / tên mục mơ hồ (pilot sách mẫu: $0)

pilot:                       # chương mẫu (P0.6): mọi phase chạy phần này trước rồi mới chạy toàn sách
  page_start: 4              # SỐ TRANG PDF (không phải số trang in; trang in 1 = PDF 4 ở sách mẫu)
  page_end: 9
  diseases:                  # tên như trong mục lục; kiểm tra bằng `dm pilot check`
    - Viêm khớp dạng thấp
    - Thoái hóa khớp gối
    - Viêm loét dạ dày tá tràng

p1:                          # P1 - trích xuất và làm sạch text (docs/phases/P1/plan.md)
  furniture:                 # P1.2 - header/footer/số trang
    top_zone: 0.09           # dòng nằm trong 9% đầu trang → có thể là header
    bottom_zone: 0.09        # dòng nằm trong 9% cuối trang → có thể là footer
    min_repeat_pages: 2      # lặp lại ở ≥ 2 trang (chữ số coi như nhau) → header/footer chạy
    small_ratio: 0.95        # chữ ≤ 95% cỡ thân bài nằm ở lề → header (kể cả chỉ xuất hiện 1 lần)
  blocks:                    # P1.3 - dựng block
    bullet_markers: ["-", "•", "–", "+"]
    para_gap_ratio: 0.25     # khoảng cách dòng dôi ra ≥ 0.25 × cỡ chữ → đoạn mới
    x_tolerance: 3.0         # sai số lề trái (pt) khi xét dòng tiếp của đoạn
    join_across_pages: true  # nối đoạn bị ngắt qua trang (khi câu trước chưa kết thúc)
    table_min_rows: 2        # bảng = ≥ 2 hàng liên tiếp...
    table_min_cells: 2       # ...mỗi hàng ≥ 2 dòng cùng dải dọc
    heading_size_delta: 1.5  # tiêu đề chỉ dựa vào cỡ chữ: phải ≥ thân bài + 1.5pt
  fix:                       # P1.4 - sửa lỗi OCR bằng LLM (tác vụ `fix_ocr` trong models.yaml)
    enabled: true
    prompt: p1_fix_ocr       # prompts/p1_fix_ocr.md (có version, ghi vào manifest)
    blocks_per_call: 25      # số block mỗi lời gọi (gửi theo trang để có ngữ cảnh)
    max_changed_ratio: 0.35  # LLM đổi > 35% số từ của block → từ chối cả block
    min_similarity: 0.6      # từ mới phải giống từ cũ (sau khi bỏ dấu) ≥ 60%
    glossary: configs/glossary.yaml

p2:                          # P2 - dựng cây cấu trúc (docs/phases/P2/plan.md)
  toc:                       # P2.1 - mục lục
    pages: auto              # auto = tự tìm trong search_pages trang đầu; hoặc [3, 3] (trang PDF)
    search_pages: 15
    min_entries: 2           # trang có ≥ 2 dòng chấm dẫn → trang mục lục
  headings:                  # P2.2 - phân cấp tiêu đề
    disease_size_delta: 1.5  # IN HOA, không đánh số, cỡ ≥ thân bài + 1.5 → ứng viên bệnh
    use_toc: true            # dùng mục lục để xác nhận/sửa cấp
    toc_match_min: 0.85      # khớp gần với mục lục (tiêu đề mục lục có thể còn lỗi OCR)
    llm_fallback: true       # tiêu đề còn tin cậy thấp → hỏi LLM (tác vụ `classify`)
    prompt: p2_classify_heading
  sections:                  # P2.4 - ánh xạ loại mục (section_type)
    map: configs/section_map.yaml   # tên mục KHÔNG DẤU → loại; người duyệt bổ sung dần
    fuzzy_min: 0.9           # khớp gần với khóa từ điển (chịu lỗi OCR nhầm 1 ký tự)
    llm_fallback: true       # tên mục lạ → LLM đề xuất → hàng đợi duyệt (CSV)
    prompt: p2_classify_section
    context_chars: 400       # phần đầu nội dung mục gửi kèm cho LLM
