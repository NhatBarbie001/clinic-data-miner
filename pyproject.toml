[project]
name = "dataminer"
version = "0.1.0"
description = "Khai thác dữ liệu y khoa từ sách PDF (đã OCR): RAG, hỏi đáp, truy vấn hàng loạt, sinh dữ liệu huấn luyện LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
dm = "dataminer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataminer"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]
# RUF001-003: cho phép ký tự Unicode "dễ nhầm" vì code và docstring có tiếng Việt.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
# Khối code trong tài liệu .md là minh họa (căn chỉnh để đọc) → không format.
exclude = ["*.md"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["dataminer"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: gọi API thật (tốn tiền), mặc định bị bỏ qua; chạy bằng `pytest -m live`",
]
