# Chạy: uv run pre-commit run --all-files
# ruff và mypy dùng hook "local" để chạy đúng phiên bản trong môi trường uv (khớp uv.lock).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # samples/ chứa output nguyên văn của lệnh → không được tự sửa.
      - id: trailing-whitespace
        exclude: ^samples/
      - id: end-of-file-fixer
        exclude: ^samples/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=200"]   # giữ samples/ nhỏ; data/ đã bị gitignore
        exclude: ^uv\.lock$     # lockfile sinh tự động, được phép lớn

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
